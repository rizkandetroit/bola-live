name: Tes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node bola-live/scripts/test.mjs
      - run: node bola-live/scripts/test-world.mjs
      - run: node bola-live/scripts/test-all.mjs
      - run: node bola-live/scripts/test-sportapi.mjs
      - run: node bola-live/scripts/test-pred.mjs
      - run: node bola-live/scripts/test-lite.mjs
      - run: node bola-live/scripts/test-understat.mjs
      - run: node bola-live/scripts/test-ui.mjs
      - run: node bola-live/scripts/test-ci.mjs
      - run: node bola-live/scripts/test-pitch.mjs
      - run: node bola-live/scripts/test-intelligence.mjs
