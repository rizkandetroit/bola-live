name: Update dan deploy
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub menjalankan paling cepat tiap 5 menit (sering terlambat beberapa menit)
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
# Satu run berjalan sekaligus; run terjadwal berikutnya menunggu.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Pemeriksaan awal (token dan GitHub Pages)
        run: node bola-live/scripts/preflight.mjs
        continue-on-error: true
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # V12.2: hanya BSD. Tiap 5 menit = mode ringan (live). Tiap ~1 jam / manual = mode berat (klasemen + Match Center penuh).
      - name: Tentukan mode dan bawa data run berat sebelumnya
        id: mode
        run: node bola-live/scripts/carry.mjs
        env:
          FORCE_HEAVY: ${{ vars.FORCE_HEAVY }}

      # SEMUA liga: jadwal, skor, live, H2H, prediksi, logo -> all.json (menggantikan API-Football, SportAPI, FotMob, TheSportsDB)
      - name: Ambil SEMUA liga (BSD)
        run: node bola-live/scripts/bsd.mjs
        continue-on-error: true
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BSD_DEEP: "1"
          BSD_MODE: ${{ steps.mode.outputs.heavy == '1' && 'heavy' || 'light' }}
          BSD_MAX_DETAIL: 400
          BSD_CONCURRENCY: 6
          GAP_MS: 150

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bola-live/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
